    <!-- Lenis smooth scroll (CDN) — desktop only, disabled on touch devices -->
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.20/dist/lenis.css" />
    <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
    <style>
      /* Counteract Lenis CSS on mobile — it sets html/body height:auto
         which breaks fixed positioning and causes layout issues */
      @media (pointer: coarse) {
        html, html.lenis, html.lenis body {
          height: 100% !important;
          overflow: hidden !important;
        }
      }
    </style>
